name: Feature request
description: Suggest a change to the admin portal.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem you want solved and the change you have in mind. One request per issue.
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of the portal would this change?
      options:
        - Login
        - Dashboard
        - Users
        - Studies
        - Organizations
        - Radiologists
        - Reports
        - Billing
        - Settings
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Who is blocked, and what they cannot do today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: What should the portal do instead?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Other approaches you considered, if any.
